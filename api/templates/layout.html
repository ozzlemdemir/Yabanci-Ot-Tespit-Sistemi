<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


  <title>{% block title %}YabancıOt Tespit{% endblock %}</title>
  <style>
    /* ── Reset & tokens ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:   #1a6b2f;
      --green-mid:    #2d8c47;
      --green-light:  #3aab57;
      --green-pale:   #e8f5ec;
      --green-accent: #4caf72;
      --red:          #e05252;
      --orange:       #e8923a;
      --yellow:       #e8c23a;
      --text:         #1a1a1a;
      --text-muted:   #6b7280;
      --border:       #dde4da;
      --bg:           #f5f8f5;
      --white:        #ffffff;
      --sidebar-w:    300px;
      --radius:       10px;
      --shadow:       0 1px 4px rgba(0,0,0,.08);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ─────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--green-dark);
      display: flex;
      flex-direction: column;
      padding: 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 10;
    }

    .sidebar-logo {
      padding: 20px 18px 16px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .sidebar-logo .logo-icon {
      font-size: 29px;
      margin-bottom: 4px;
    }
    .sidebar-logo .logo-title {
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.3;
    }
    .sidebar-logo .logo-sub {
      color: rgba(255,255,255,.55);
      font-size: 11px;
    }

    .sidebar-user {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,.12);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-user .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--green-accent);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 15px;
      flex-shrink: 0;
    }
    .sidebar-user .uname {
      color: #fff; font-size: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-user .urole {
      color: rgba(255,255,255,.5); font-size: 11px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 7px;
      color: rgba(255,255,255,.7);
      text-decoration: none;
      font-size: 20px;
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .nav-link:hover { background: rgba(255,255,255,.1); color: #fff; }
    .nav-link.active { background: var(--green-light); color: #fff; }
    .nav-link .icon { font-size: 16px; width: 20px; text-align: center; }

    .sidebar-footer {
      padding: 12px 10px;
      border-top: 1px solid rgba(255,255,255,.12);
    }
    .logout-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 7px;
      background: none;
      border: none;
      color: rgba(255,255,255,.5);
      font-size: 17px;
      cursor: pointer;
      text-decoration: none;
      transition: color .15s;
    }
    .logout-btn:hover { color: rgba(255,255,255,.9); }

    /* ── Main content ────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar h1 { font-size: 17px; font-weight: 700; color: var(--text); }
    .topbar .date { font-size: 12px; color: var(--text-muted); }

    .content {
      padding: 28px;
      flex: 1;
    }

    /* ── Shared components ───────────────────────────── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--green-mid);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
      width: 100%;
    }
    .btn-primary:hover { background: var(--green-dark); }

    .danger-high   { color: var(--red);    }
    .danger-medium { color: var(--orange); }
    .danger-low    { color: var(--yellow); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-high   { background: #fdecea; color: var(--red);    }
    .badge-medium { background: #fef3e7; color: var(--orange); }
    .badge-low    { background: #fefce7; color: #b07d10;       }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🌿</div>
    <div class="logo-title">Yabancı Ot Tespit Sistemi</div>
    <div class="logo-sub">Akıllı Tarım Platformu</div>
  </div>

  <div class="sidebar-user">
    <div class="avatar">AY</div>
    <div>
      <div class="uname">{{ user }}</div>
      <div class="urole">Çiftçi / Üretici</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/dashboard" class="nav-link {% if active=='dashboard' %}active{% endif %}">
      <span class="icon"><i class="fa-solid fa-chart-simple"></i></span> Ana Sayfa
    </a>
    <a href="/analizler" class="nav-link {% if active=='analyze' %}active{% endif %}">
      <span class="icon"><i class="fa-solid fa-magnifying-glass"></i></span> Analiz Yap
    </a>
    <a href="/gecmis" class="nav-link {% if active=='history' %}active{% endif %}">
      <span class="icon"><i class="fa-solid fa-arrow-rotate-left"></i></span> Geçmiş Analizler
    </a>
    <a href="/profile" class="nav-link {% if active=='profile' %}active{% endif %}">
      <span class="icon"><i class="fa-regular fa-user"></i></span> Profilim
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="/" class="logout-btn">
      <span class="icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span> Güvenli Çıkış
    </a>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <h1>{% block page_title %}{% endblock %}</h1>
    <span class="date" id="date-display"></span>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</div>

<script>
  const d = new Date();
  document.getElementById("date-display").textContent =
    d.toLocaleDateString("tr-TR", {day:"numeric",month:"long",year:"numeric"});
</script>
{% block extra_script %}{% endblock %}
</body>
</html>
