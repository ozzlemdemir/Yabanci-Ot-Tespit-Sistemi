<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yabancı Ot Tespit Sistemi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --background: #f3f7f4;
      --surface: #ffffff;
      --text: #1d3022;
      --muted: #687a6c;
      --border: #d7e0d9;
      --primary: #2d8335;
      --primary-dark: #246b2b;
      --focus: rgba(45, 131, 53, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background: var(--background);
      color: var(--text);
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
    }

    .login-card {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 8px 28px rgba(32, 63, 38, 0.04);
      max-width: 900px;
      padding: 60px 60px 44px;
      width: 100%;
    }

    .brand {
      margin-bottom: 30px;
      text-align: center;
    }

    .brand-icon {
      align-items: center;
      background: #e8f5ea;
      border-radius: 50%;
      color: var(--primary);
      display: inline-flex;
      height: 82px;
      justify-content: center;
      margin-bottom: 10px;
      position: relative;
      width: 82px;
    }

    .brand-icon i {
      font-size: 35px;
      line-height: 1;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -1px;
      margin: 0 0 24px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 18px;
      margin: 0;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 18px;
      min-height: 58px;
      outline: none;
      padding: 0 17px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
      width: 100%;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--focus);
    }

    input::placeholder {
      color: var(--muted);
    }

    .password-input {
      padding-right: 54px;
    }

    .password-toggle {
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 22px;
      padding: 6px;
      position: absolute;
      right: 12px;
      top: 11px;
    }

    .submit-button {
      background: var(--primary);
      border: 0;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 20px;
      font-weight: 700;
      min-height: 60px;
      margin-top: 8px;
      transition: background 160ms ease, transform 160ms ease;
      width: 100%;
    }

    .submit-button:hover {
      background: var(--primary-dark);
    }

    .submit-button:active {
      transform: translateY(1px);
    }

    .forgot-password {
      color: var(--primary-dark);
      display: block;
      font-size: 17px;
      margin-top: 30px;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .login-card {
        border-radius: 0;
        min-height: 100vh;
        padding: 44px 24px 32px;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <header class="brand">
            <div class="brand-icon" aria-hidden="true"><i class="fa-solid fa-leaf"></i></div>
      <h1>Yabancı Ot Tespit Sistemi</h1>
      <p class="subtitle">Akıllı Tarım ve Bitki Koruma Platformu</p>
    </header>

    <form>
      <div class="form-group">
        <label for="email_input">E-posta Adresi</label>
        <input type="email" id="email_input" name="email" placeholder="ornek@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="password_input">Şifre</label>
        <div class="input-wrapper">
          <input class="password-input" type="password" id="password_input" name="password" placeholder="••••••••" required>
          <button class="password-toggle" type="button" aria-label="Şifreyi göster" onclick="togglePassword()">◉</button>
        </div>
      </div>

      <button class="submit-button" type="submit">Giriş Yap</button>
    </form>

    <a class="forgot-password" href="/register">Şifremi Unuttum</a>
  </main>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password_input");
      passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
